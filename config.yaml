general:
  name: sugerR-reconstruct-experiment
  t_run_ms: 1000
  
  comp-path: ./2023_03_23_completeness_630_final.csv
  conn-path: ./2023_03_23_connectivity_630_final.parquet
  output-dir: ./outputs

LIF-params:
  method: linear
  
  eqs: |
    dv/dt = (v_0 - v + g) / tau_mbr : volt (unless refractory)
    dg/dt = -g / tau_syn            : volt (unless refractory) 
    rfc                             : second
  threshold: v > v_threshold
  reset: v = v_reset; g = 0 * mV
  
  v_0_mV: -52
  v_reset_mV: -52
  v_threshold_mV: -45
  
  t_refactory_ms: 2.2
  tau_mbr_ms: 20
  tau_syn_ms: 5
  t_refractory_ms: 2.2
  t_delay_ms: 1.8
  
  w_syn_mV: 0.275

STDP-params:
  ...